name: Scoped learning
on:
  pull_request:
    paths:
      - 'src/memory-scope/**'
      - 'plugins/scoped-workshop/**'
      - 'tests/scoped-workshop/**'
      - 'vitest.workshop.config.ts'
      - 'bin/scope-setup.js'
      - 'bin/dingtalk-connector.js'
      - 'docs/scoped-setup.md'
      - 'src/config/schema.ts'
      - 'src/core/message-handler.ts'
      - 'src/reply-dispatcher.ts'
      - 'src/services/media*'
      - 'src/services/media/**'
      - 'src/services/messaging.ts'
      - 'tests/memory-scope/**'
      - 'tests/media/**'
      - 'tests/reply-dispatcher/**'
      - 'tests/core/message-handler-learn.test.ts'
      - 'openclaw.plugin.json'
      - 'package.json'
      - 'tsconfig.scoped-learning.json'
      - 'tsconfig.hard-memory.json'
      - '.github/workflows/scoped-learning.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      # Rolldown ships native binaries as optional packages, not an install script.
      # Include them explicitly even if the runner inherits an omit=optional setting.
      - run: npm install --ignore-scripts --include=dev --include=optional --engine-strict --no-audit --no-fund --package-lock=false
      - name: Verify runtime and native bundler
        run: node --input-type=module -e "await import('rolldown'); console.log(process.version, process.platform, process.arch, 'require(esm)=', process.features.require_module)"
      - run: npx tsc --project tsconfig.scoped-learning.json --noEmit
      - run: npx tsc --project tsconfig.hard-memory.json --noEmit
      - run: npx tsc --project plugins/scoped-workshop/tsconfig.json --noEmit
      - run: npm test
      - run: npm run test:workshop
      - run: npm run test:hard-memory
      - run: npm run build
      - run: npm run build:workshop
      - run: node --test tests/memory-scope/scoped-workshop-package.test.mjs
      - name: Scope setup against the actual CLI and schema
        run: node --test tests/memory-scope/setup-host.test.mjs
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sandbox: ['off', none, knowledge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm install --ignore-scripts --include=dev --include=optional --engine-strict --no-audit --no-fund --package-lock=false
      - if: matrix.sandbox != 'off'
        run: docker pull node:22-alpine
      - run: npm run build
      - run: npm run build:workshop
      - name: Production handler and independent Workshop on pinned-compatible host
        shell: bash
        run: python3 tests/memory-scope/native-workshop-gateway/run.py --sandbox '${{ matrix.sandbox }}' | tee gateway-proof.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-${{ matrix.sandbox }}
          path: |
            gateway-proof.log
            /tmp/scoped-workshop-gateway-*/result.json
            /tmp/scoped-workshop-gateway-*/gateway.log
            /tmp/scoped-workshop-gateway-*/config-validation.log
            /tmp/scoped-workshop-gateway-*/provider-calls.json
