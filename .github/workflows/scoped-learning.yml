name: Scoped learning
on:
  pull_request:
    paths:
      - 'src/memory-scope/**'
      - 'src/turn-state/**'
      - 'src/questions/**'
      - 'src/approvals/**'
      - 'src/card-exec-preview/**'
      - 'src/messages/**'
      - 'src/utils/quote-*'
      - 'src/core/connection.ts'
      - 'src/core/conversation-run.ts'
      - 'src/core/host-turn-lifecycle.ts'
      - 'tests/turn-state/**'
      - 'tests/questions/**'
      - 'tests/approvals/**'
      - 'bin/scope-setup.js'
      - 'bin/dingtalk-connector.js'
      - 'docs/scoped-setup.md'
      - 'src/config/schema.ts'
      - 'src/core/message-handler.ts'
      - 'src/reply-dispatcher.ts'
      - 'src/services/media*'
      - 'src/services/media/**'
      - 'src/services/messaging.ts'
      - 'tests/memory-scope/**'
      - 'tests/media/**'
      - 'tests/reply-dispatcher/**'
      - 'tests/core/message-handler-learn.test.ts'
      - 'openclaw.plugin.json'
      - 'package.json'
      - 'tsconfig.scoped-learning.json'
      - 'tsconfig.hard-memory.json'
      - '.github/workflows/scoped-learning.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      # Rolldown ships native binaries as optional packages, not an install script.
      # Include them explicitly even if the runner inherits an omit=optional setting.
      - run: npm install --ignore-scripts --include=dev --include=optional --engine-strict --no-audit --no-fund --package-lock=false
      - name: Verify runtime and native bundler
        run: node --input-type=module -e "await import('rolldown'); console.log(process.version, process.platform, process.arch, 'require(esm)=', process.features.require_module)"
      - run: npx tsc --project tsconfig.scoped-learning.json --noEmit
      - run: npx tsc --project tsconfig.hard-memory.json --noEmit
      - run: npm test
      - run: node --experimental-transform-types --test tests/turn-state/platform.test.mjs
      - run: npm run test:hard-memory
      - run: npm run build
      - run: node --test tests/memory-scope/scoped-workshop-package.test.mjs
      - name: Scope setup against the actual CLI and schema
        run: node --test tests/memory-scope/setup-host.test.mjs
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sandbox: ['off', none, ro, rw, knowledge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm install --ignore-scripts --include=dev --include=optional --engine-strict --no-audit --no-fund --package-lock=false
      - run: docker pull node:22-alpine
      - run: node tests/memory-scope/ingress-probe/build.mjs "$PWD/handler-bundle.mjs"
      - name: Production handler and scoped learning on stock host
        shell: bash
        run: python3 tests/memory-scope/learning-ingress-probe/run.py --openclaw "$PWD/node_modules/.bin/openclaw" --handler --sandbox '${{ matrix.sandbox }}' | tee gateway-proof.log
      - name: Real setup and reload followed by scoped ingress
        if: matrix.sandbox == 'off'
        shell: bash
        run: python3 tests/memory-scope/learning-ingress-probe/run.py --openclaw "$PWD/node_modules/.bin/openclaw" --handler --sandbox off --setup | tee setup-proof.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-${{ matrix.sandbox }}
          path: |
            gateway-proof.log
            setup-proof.log
            /tmp/learning-ingress-probe-*/results.json
            /tmp/learning-ingress-probe-*/gateway.log
            /tmp/learning-ingress-probe-*/config-validation.json
            /tmp/learning-ingress-probe-*/scope-setup.log
