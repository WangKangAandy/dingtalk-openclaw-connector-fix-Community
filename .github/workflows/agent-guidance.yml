name: Agent guidance files

on:
  push:
    paths: ['bin/**', 'guidance/**', 'tests/agent-guidance/**', 'package.json', '.github/workflows/agent-guidance.yml']
  pull_request:
    paths: ['bin/**', 'guidance/**', 'tests/agent-guidance/**', 'package.json', '.github/workflows/agent-guidance.yml']

permissions:
  contents: read

jobs:
  files:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install/postinstall: this feature uses only Node built-ins.
      - run: npm run test:guidance
      - run: npm pack --dry-run --ignore-scripts
