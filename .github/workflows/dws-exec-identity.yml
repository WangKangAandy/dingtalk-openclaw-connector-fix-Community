name: DWS exec identity
on:
  pull_request:
    paths:
      - 'src/dws-exec-identity.ts'
      - 'src/core/message-handler.ts'
      - 'bin/dws-*'
      - 'scripts/install-dws-profile-shim.js'
      - 'scripts/dws-community-config.js'
      - 'tests/dws-exec-identity/**'
      - '.github/workflows/dws-exec-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shim:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: node --experimental-strip-types --test tests/dws-exec-identity/shim.test.mjs
